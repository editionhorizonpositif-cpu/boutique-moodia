<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Boutique Moodia{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6C5CE7;
            --primary-dark: #5A4BD1;
            --secondary: #00CEC9;
            --dark: #2D3436;
            --gray: #636E72;
            --light: #F8F9FA;
            --white: #FFFFFF;
            --shadow: 0 2px 20px rgba(0,0,0,0.08);
            --radius: 16px;
            --radius-sm: 10px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #F5F6FA;
            color: var(--dark);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* ---------- NAVIGATION ---------- */
        .navbar {
            background: var(--white);
            border-bottom: 1px solid #E8EAED;
            padding: 0 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
            background: rgba(255,255,255,0.95);
        }
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 70px;
        }
        .logo {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--primary);
            text-decoration: none;
            letter-spacing: -0.5px;
        }
        .logo span { color: var(--secondary); }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 2rem;
            list-style: none;
        }
        .nav-links a {
            text-decoration: none;
            color: var(--dark);
            font-weight: 500;
            font-size: 0.95rem;
            transition: color 0.2s;
            position: relative;
        }
        .nav-links a:hover { color: var(--primary); }
        .cart-badge {
            background: var(--primary);
            color: white;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 700;
            margin-left: 4px;
            position: relative;
            top: -8px;
        }

        /* ---------- CONTAINER ---------- */
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        /* ---------- FOOTER ---------- */
        .footer {
            text-align: center;
            padding: 2rem;
            color: var(--gray);
            font-size: 0.85rem;
            border-top: 1px solid #E8EAED;
            margin-top: 4rem;
        }

        /* ---------- BOUTONS ---------- */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 12px 24px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
        }
        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 15px rgba(108,92,231,0.3);
        }
        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(108,92,231,0.4);
        }
        .btn-outline {
            border: 2px solid var(--primary);
            color: var(--primary);
            background: transparent;
        }
        .btn-outline:hover {
            background: var(--primary);
            color: white;
        }
        .btn-danger {
            background: #FF6B6B;
            color: white;
            font-size: 0.85rem;
            padding: 8px 16px;
        }
        .btn-danger:hover { background: #E55A5A; }
        .btn-small {
            padding: 8px 16px;
            font-size: 0.85rem;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>

    <!-- NAVIGATION -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="/shop" class="logo">Moodia<span>.</span></a>
            <ul class="nav-links">
                <li><a href="/shop">Boutique</a></li>
                <li>
                    <a href="/cart">
                        Panier
                        {% if cart_count is defined and cart_count > 0 %}
                            <span class="cart-badge">{{ cart_count }}</span>
                        {% endif %}
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- CONTENU PRINCIPAL -->
    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        &copy; {{ now.year if now else 2026 }} Moodia. Tous droits réservés.
    </footer>

</body>
</html>
