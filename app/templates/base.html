<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Boutique Moodia</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .product { border: 1px solid #ccc; padding: 10px; margin: 10px 0; display: flex; align-items: center; }
        .product img { max-width: 100px; margin-right: 20px; }
        .cart-item { border-bottom: 1px solid #eee; padding: 5px 0; }
        .btn { background-color: #0070ba; color: white; padding: 8px 16px; border: none; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn:hover { background-color: #005fa3; }
    </style>
</head>
<body>
    <h1>Boutique Moodia</h1>
    <nav>
        <a href="/shop">Accueil</a> | 
        <a href="/cart">Panier</a>
    </nav>
    <hr>
    {% block content %}{% endblock %}
</body>
</html>
